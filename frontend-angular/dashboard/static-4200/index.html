<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutritionist AI - Authentication</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #2E7D32;
      --primary-light: #4CAF50;
      --primary-dark: #1B5E20;
      --accent-color: #FF6B35;
      --background-color: #F8F9FA;
      --card-background: #FFFFFF;
      --text-primary: #2C3E50;
      --text-secondary: #6C757D;
      --border-color: #E9ECEF;
      --success-color: #28A745;
      --error-color: #DC3545;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
      --border-radius: 8px;
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--background-color);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-container {
      background-color: var(--card-background);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-hover);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-header .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .auth-header h1 {
      color: var(--text-primary);
      font-size: 28px;
      margin-bottom: 5px;
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--background-color);
      transition: var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
      background-color: #fff;
    }

    input:disabled {
      background-color: #f5f5f5;
      cursor: not-allowed;
    }

    .error-text {
      color: var(--error-color);
      font-size: 12px;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: var(--border-radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      color: white;
      margin-top: 10px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 12px 16px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      font-size: 14px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .auth-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .auth-links a {
      color: var(--primary-color);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Login Form -->
    <div id="loginForm">
      <div class="auth-header">
        <div class="icon">🥗</div>
        <h1>Nutritionist AI</h1>
        <p>Connexion</p>
      </div>

      <div id="loginMessage"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required placeholder="votre@email.com">
          <div class="error-text" id="loginEmailError"></div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Mot de passe</label>
          <input type="password" id="loginPassword" required placeholder="••••••" minlength="6">
          <div class="error-text" id="loginPasswordError"></div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">Se connecter</button>
      </form>

      <div class="auth-links">
        Pas de compte ? <a onclick="switchToRegister()">Créer un compte</a>
      </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden">
      <div class="auth-header">
        <div class="icon">🥗</div>
        <h1>Nutritionist AI</h1>
        <p>Créer un compte</p>
      </div>

      <div id="registerMessage"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="registerUsername">Nom d'utilisateur</label>
          <input type="text" id="registerUsername" required placeholder="votreusername">
          <div class="error-text" id="registerUsernameError"></div>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" required placeholder="votre@email.com">
          <div class="error-text" id="registerEmailError"></div>
        </div>

        <div class="form-group">
          <label for="registerPassword">Mot de passe</label>
          <input type="password" id="registerPassword" required placeholder="••••••" minlength="6">
          <div class="error-text" id="registerPasswordError"></div>
        </div>

        <div class="form-group">
          <label for="registerPoids">Poids (kg)</label>
          <input type="number" id="registerPoids" required placeholder="70" min="30" max="300">
          <div class="error-text" id="registerPoidsError"></div>
        </div>

        <div class="form-group">
          <label for="registerTaille">Taille (cm)</label>
          <input type="number" id="registerTaille" required placeholder="170" min="100" max="250">
          <div class="error-text" id="registerTailleError"></div>
        </div>

        <div class="form-group">
          <label for="registerAge">Âge</label>
          <input type="number" id="registerAge" required placeholder="25" min="13" max="120">
          <div class="error-text" id="registerAgeError"></div>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">Créer un compte</button>
      </form>

      <div class="auth-links">
        Déjà inscrit ? <a onclick="switchToLogin()">Se connecter</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:8080/api/users';

    // Clear errors
    function clearErrors() {
      document.querySelectorAll('.error-text').forEach(el => el.textContent = '');
    }

    // Show message
    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `message ${type}`;
      el.style.display = 'block';
    }

    // Switch to register
    function switchToRegister() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      clearErrors();
    }

    // Switch to login
    function switchToLogin() {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      clearErrors();
    }

    // Handle login
    async function handleLogin(event) {
      event.preventDefault();
      clearErrors();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showMessage('loginMessage', 'Veuillez remplir tous les champs', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connexion en cours...';

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('userEmail', email);
          localStorage.setItem('username', data.username);
          localStorage.setItem('userData', JSON.stringify(data));
          showMessage('loginMessage', 'Connexion réussie! Redirection...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } else {
          showMessage('loginMessage', data.message || 'Email ou mot de passe incorrect', 'error');
        }
      } catch (error) {
        showMessage('loginMessage', 'Erreur de connexion au serveur', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    }

    // Handle register
    async function handleRegister(event) {
      event.preventDefault();
      clearErrors();

      const username = document.getElementById('registerUsername').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const poids = parseInt(document.getElementById('registerPoids').value);
      const taille = parseInt(document.getElementById('registerTaille').value);
      const age = parseInt(document.getElementById('registerAge').value);
      const btn = document.getElementById('registerBtn');

      // Validations
      if (!username || username.length < 2) {
        document.getElementById('registerUsernameError').textContent = 'Min 2 caractères';
        return;
      }
      if (poids < 30 || poids > 300) {
        document.getElementById('registerPoidsError').textContent = 'Entre 30 et 300 kg';
        return;
      }
      if (taille < 100 || taille > 250) {
        document.getElementById('registerTailleError').textContent = 'Entre 100 et 250 cm';
        return;
      }
      if (age < 13 || age > 120) {
        document.getElementById('registerAgeError').textContent = 'Entre 13 et 120 ans';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Création en cours...';

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, poids, taille, age })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('userEmail', email);
          localStorage.setItem('username', username);
          localStorage.setItem('userData', JSON.stringify(data));
          showMessage('registerMessage', 'Compte créé avec succès! Redirection...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } else {
          showMessage('registerMessage', data.message || 'Erreur lors de l\'inscription', 'error');
        }
      } catch (error) {
        showMessage('registerMessage', 'Erreur de connexion au serveur', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Créer un compte';
      }
    }

    // Check if user is logged in
    window.addEventListener('load', () => {
      const username = localStorage.getItem('username');
      if (username) {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
