<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un Repas - Nutritionist AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #2E7D32;
      --primary-dark: #1B5E20;
      --accent-color: #FF6B35;
      --text-primary: #2C3E50;
      --text-secondary: #6C757D;
      --border-color: #E9ECEF;
      --background-color: #f5f7fa;
      --card-background: #FFFFFF;
      --success-color: #28A745;
      --error-color: #DC3545;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 0;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo .icon {
      font-size: 32px;
    }

    .nav-logo h1 {
      font-size: 20px;
      margin: 0;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      gap: 2rem;
      align-items: center;
      margin: 0;
    }

    .nav-menu a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .nav-menu a:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-logout {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .btn-logout:hover {
      background: #E55A1C;
      transform: translateY(-2px);
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-header {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-header h2 {
      color: var(--text-primary);
      margin: 0;
    }

    .btn-back {
      background: var(--text-secondary);
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .btn-back:hover {
      background: var(--text-primary);
      transform: translateY(-2px);
    }

    .meal-form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-width: 600px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 14px;
    }

    input[type="text"],
    textarea,
    input[type="date"],
    input[type="time"],
    select {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    textarea:focus,
    input[type="date"]:focus,
    input[type="time"]:focus,
    select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .image-upload-section {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .image-upload-section:hover {
      border-color: var(--primary-color);
      background: rgba(46, 125, 50, 0.05);
    }

    .image-upload-section.dragover {
      border-color: var(--primary-color);
      background: rgba(46, 125, 50, 0.1);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 1rem;
    }

    .upload-text {
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .upload-hint {
      font-size: 12px;
      color: var(--text-secondary);
    }

    #imageInput {
      display: none;
    }

    .image-preview {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 1rem;
    }

    .preview-item {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      aspect-ratio: 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-item .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: var(--error-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .preview-item .remove-btn:hover {
      background: #C82333;
    }

    .form-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-submit {
      flex: 1;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-submit:disabled {
      background: #CCC;
      cursor: not-allowed;
      transform: none;
    }

    .btn-cancel {
      flex: 1;
      background: var(--border-color);
      color: var(--text-primary);
      border: none;
      padding: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-cancel:hover {
      background: var(--text-secondary);
      color: white;
    }

    .message {
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      animation: slideDown 0.3s ease;
    }

    .message.success {
      background: rgba(40, 167, 69, 0.1);
      color: #155724;
      border-left: 4px solid var(--success-color);
    }

    .message.error {
      background: rgba(220, 53, 69, 0.1);
      color: #721c24;
      border-left: 4px solid var(--error-color);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .nav-menu {
        gap: 1rem;
      }

      .main-content {
        padding: 1rem;
      }

      .meal-form {
        padding: 1.5rem;
      }

      .page-header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-content">
      <div class="nav-logo">
        <span class="icon">🥗</span>
        <h1>Nutritionist AI</h1>
      </div>
      <ul class="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="add-meal.html" style="font-weight: 600; background: rgba(255, 255, 255, 0.3);">Ajouter un repas</a></li>
        <li><a href="my-meals.html">Mes repas</a></li>
        <li><button class="btn-logout" onclick="logout()">Déconnexion</button></li>
      </ul>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <h2>📸 Ajouter un Repas</h2>
      <button class="btn-back" onclick="goBack()">← Retour au Dashboard</button>
    </div>

    <div class="meal-form">
      <div id="messageContainer"></div>

      <form id="mealForm">
        <div class="form-group">
          <label for="mealName">Nom du repas *</label>
          <input type="text" id="mealName" required placeholder="ex: Pâtes Carbonara">
        </div>

        <div class="form-group">
          <label for="mealDate">Date *</label>
          <input type="date" id="mealDate" required>
        </div>

        <div class="form-group">
          <label for="mealTime">Heure *</label>
          <input type="time" id="mealTime" required>
        </div>

        <div class="form-group">
          <label for="mealType">Type de repas *</label>
          <select id="mealType" required>
            <option value="">-- Sélectionner un type --</option>
            <option value="petit-dejeuner">Petit déjeuner</option>
            <option value="dejeuner">Déjeuner</option>
            <option value="diner">Dîner</option>
            <option value="snack">Snack</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mealDescription">Description</label>
          <textarea id="mealDescription" placeholder="Décrivez ce que vous avez mangé..."></textarea>
        </div>

        <div class="form-group">
          <label>Photos du repas</label>
          <div class="image-upload-section" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Glissez-déposez vos photos ici</div>
            <div class="upload-hint">ou cliquez pour sélectionner</div>
          </div>
          <input type="file" id="imageInput" multiple accept="image/*">
          <div class="image-preview" id="imagePreview"></div>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn-submit">✓ Enregistrer le repas</button>
          <button type="button" class="btn-cancel" onclick="resetForm()">Annuler</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Set today's date by default
    document.getElementById('mealDate').valueAsDate = new Date();

    // Image upload handling
    const uploadArea = document.getElementById('uploadArea');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    let selectedImages = [];

    uploadArea.addEventListener('click', () => imageInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    imageInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (let file of files) {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            selectedImages.push(e.target.result);
            displayImages();
          };
          reader.readAsDataURL(file);
        }
      }
    }

    function displayImages() {
      imagePreview.innerHTML = '';
      selectedImages.forEach((img, index) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `
          <img src="${img}" alt="Preview">
          <button type="button" class="remove-btn" onclick="removeImage(${index})">✕</button>
        `;
        imagePreview.appendChild(div);
      });
    }

    function removeImage(index) {
      selectedImages.splice(index, 1);
      displayImages();
    }

    // Form submission
    document.getElementById('mealForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const mealData = {
        name: document.getElementById('mealName').value,
        date: document.getElementById('mealDate').value,
        time: document.getElementById('mealTime').value,
        type: document.getElementById('mealType').value,
        description: document.getElementById('mealDescription').value,
        images: selectedImages,
        timestamp: new Date().getTime()
      };

      // Save to localStorage
      let meals = JSON.parse(localStorage.getItem('meals') || '[]');
      meals.push(mealData);
      localStorage.setItem('meals', JSON.stringify(meals));

      showMessage('✓ Repas enregistré avec succès!', 'success');
      setTimeout(() => {
        window.location.href = 'my-meals.html';
      }, 1500);
    });

    function resetForm() {
      document.getElementById('mealForm').reset();
      selectedImages = [];
      imagePreview.innerHTML = '';
      document.getElementById('mealDate').valueAsDate = new Date();
    }

    function showMessage(text, type) {
      const container = document.getElementById('messageContainer');
      container.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        container.innerHTML = '';
      }, 4000);
    }

    function goBack() {
      window.location.href = 'dashboard.html';
    }

    function logout() {
      localStorage.removeItem('userEmail');
      localStorage.removeItem('username');
      localStorage.removeItem('userData');
      window.location.href = '/index.html';
    }

    // Check if user is logged in
    window.addEventListener('load', () => {
      const username = localStorage.getItem('username');
      if (!username) {
        window.location.href = '/index.html';
      }
    });
  </script>
</body>
</html>
