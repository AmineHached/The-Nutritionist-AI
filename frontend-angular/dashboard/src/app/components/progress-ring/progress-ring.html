<div class="progress-ring" [style.max-width.px]="size">
  <svg viewBox="0 0 100 100" class="ring-svg" preserveAspectRatio="xMidYMid meet">
    <!-- background ring (full, subtle) -->
    <circle
      class="ring-bg"
      cx="50"
      cy="50"
      [attr.r]="radius"
      fill="none"
      [attr.stroke-width]="strokeNorm"
    />

    <!-- progress arc -->
    <circle
      class="ring-progress"
      cx="50"
      cy="50"
      [attr.r]="radius"
      fill="none"
      [attr.stroke-width]="strokeNorm"
      stroke-linecap="round"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="dashOffset"
      transform="rotate(-120 50 50)"
    />

    <!-- centered percentage -->
    <text
      x="50"
      y="50"
      text-anchor="middle"
      class="ring-text"
      [style.fontSize.px]="textSize"
      dominant-baseline="middle"
      alignment-baseline="central"
    >{{ percentage }}%</text>
  </svg>
</div>
