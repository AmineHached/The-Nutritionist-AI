<div class="profile-container">
  <div class="profile-header">
    <h1>Mon Profil</h1>
    <button 
      class="edit-btn" 
      (click)="toggleEdit()"
      [disabled]="isLoading">
      {{ isEditing ? 'Annuler' : 'Modifier' }}
    </button>
  </div>

  <div *ngIf="isLoading" class="loading">
    Chargement des données...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="userData && !isLoading" class="profile-content">
    <div class="profile-card">
      <div class="card-section">
        <h2>Informations Personnelles</h2>
        
        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <input 
            type="text" 
            [(ngModel)]="userData.username"
            [readonly]="!isEditing"
            class="form-input">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            [(ngModel)]="userData.email"
            [readonly]="!isEditing"
            class="form-input">
        </div>

        <div class="form-group">
          <label>Âge</label>
          <input 
            type="number" 
            [(ngModel)]="userData.age"
            [readonly]="!isEditing"
            class="form-input"
            min="13"
            max="120">
        </div>
      </div>

      <div class="card-section">
        <h2>Mesures Physiques</h2>
        
        <div class="form-group">
          <label>Poids (kg)</label>
          <input 
            type="number" 
            [(ngModel)]="userData.poids"
            [readonly]="!isEditing"
            class="form-input"
            min="30"
            max="300">
        </div>

        <div class="form-group">
          <label>Taille (cm)</label>
          <input 
            type="number" 
            [(ngModel)]="userData.taille"
            [readonly]="!isEditing"
            class="form-input"
            min="100"
            max="250">
        </div>

        <div class="form-group">
          <label>IMC</label>
          <div class="bmi-display">{{ bmi }}</div>
          <p class="bmi-info">Indice de Masse Corporelle</p>
        </div>
      </div>

      <div *ngIf="isEditing" class="actions">
        <button class="btn-save" (click)="saveProfile()">Sauvegarder</button>
        <button class="btn-cancel" (click)="cancelEdit()">Annuler</button>
      </div>
    </div>
  </div>
</div>
